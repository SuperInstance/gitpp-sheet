name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sheet:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: run the unit suite
        run: |
          npm test 2>&1 | tee /tmp/out.txt
          # The suite must actually RUN, not merely exit 0.
          #
          # This repo's own test script used a quoted glob
          #     node --test 'test/*.test.mjs'
          # which Node 22 expands and **Node 20 does not**. On Node 20 the
          # runner reported
          #     Could not find '.../test/*.test.mjs'
          # and exited 1 -- so 22 tests were NEVER RUN, and the job
          # reported "failure", which reads exactly like "the tests
          # failed". A test harness that silently runs nothing is the
          # same failure as one that compares against nothing.
          #
          # The script now names its files explicitly, which works on
          # both, and this assertion catches the case where the list
          # ever stops matching the files on disk.
          grep -qE '^# pass [1-9][0-9]*$' /tmp/out.txt
          test "$(grep -cE '^# pass ' /tmp/out.txt)" -ge 1

  # The live pipeline: a real fold, real claims, and a real judge.
  #
  # This is a SEPARATE job from the unit tests on purpose. The unit tests
  # must not depend on a network service, because a flaky third party
  # must not be able to turn a real defect into a red build -- and
  # equally, a green unit suite must not be mistaken for evidence that
  # the integration works.
  #
  # The live job is what catches a change in the JUDGE's behaviour, or
  # in the spec the claims are read against.
  live:
    runs-on: ubuntu-latest
    needs: sheet
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: clone the reference port, a JS port, and the spec
        run: |
          git clone --depth 1 https://github.com/SuperInstance/git.pp-doctor ../gitpp-doctor
          git clone --depth 1 https://github.com/SuperInstance/gitpp-js ../gitpp-js
          git clone --depth 1 -b spec/5-1-clarity https://github.com/SuperInstance/git.pp-spec ../gitpp-spec
      - name: run the live pipeline
        env:
          TYPESAFE_AI_TOKEN: ${{ secrets.TYPESAFE_AI_TOKEN }}
          GITPP_DOCTOR_DIR: ${{ github.workspace }}/../gitpp-doctor
          GITPP_JS_SRC: ${{ github.workspace }}/../gitpp-js/src/gitpp.js
          GITPP_SPEC: ${{ github.workspace }}/../gitpp-spec/SPEC.md
        run: node live-demo.mjs
